<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Onigiri Sensei — Splash Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
  }

  /*
    428 × 926 CSS px  ×  deviceScaleFactor 3
    = 1284 × 2778 px output  (Expo recommended splash size)
  */
  .splash {
    width: 428px;
    height: 926px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #1E1208 0%, #120A04 60%, #0A0602 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* subtle radial glow behind icon */
  .splash::before {
    content: '';
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,148,58,0.12) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    pointer-events: none;
  }

  .splash-icon {
    width: 280px;
    height: 280px;
    margin-bottom: 32px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .splash-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 20px 48px rgba(90, 50, 0, 0.2));
  }

  .splash-name {
    font-size: 30px;
    font-weight: 900;
    color: #F5E9CF;
    letter-spacing: -0.3px;
    position: relative;
    z-index: 1;
    margin-bottom: 14px;
  }

  .splash-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #C8943A;
    position: relative;
    z-index: 1;
  }

  .splash-divider::before,
  .splash-divider::after {
    content: '';
    width: 32px;
    height: 1px;
    background: currentColor;
    opacity: 0.4;
  }

  .splash-diamond {
    width: 7px;
    height: 7px;
    background: currentColor;
    transform: rotate(45deg);
    opacity: 0.65;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="splash">
  <div class="splash-icon">
    <img src="src/assets/splash-img.png" alt="Onigiri Sensei">
  </div>
  <div class="splash-name">Onigiri Sensei</div>
  <div class="splash-divider"><span class="splash-diamond"></span></div>
</div>

</body>
</html>
