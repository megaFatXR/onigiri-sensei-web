<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Onigiri Sensei — OG Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
  }

  /* ── 1200 × 630 — Open Graph spec ── */
  .og {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 76% 50%, rgba(200,148,58,0.16) 0%, transparent 55%),
      linear-gradient(138deg, #FDF8EE 0%, #F5E9CF 52%, #EDDAB4 100%);
  }

  /* ambient oversized kana, same motif as the landing hero */
  .og::before {
    content: 'あ';
    position: absolute;
    top: -90px;
    right: -60px;
    font-size: 520px;
    font-weight: 900;
    line-height: 1;
    color: rgba(176, 125, 46, 0.07);
    z-index: 1;
  }

  /* ── Left text ── */
  .og-text {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 560px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 72px;
    z-index: 3;
  }

  .og-tag {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #B07D2E;
    margin-bottom: 16px;
  }

  .og-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #B07D2E;
    margin-bottom: 24px;
  }

  .og-divider::before,
  .og-divider::after {
    content: '';
    width: 44px;
    height: 1px;
    background: currentColor;
    opacity: 0.35;
  }

  .og-diamond {
    width: 9px;
    height: 9px;
    background: currentColor;
    transform: rotate(45deg);
    opacity: 0.65;
    flex-shrink: 0;
  }

  .og-headline {
    font-size: 88px;
    font-weight: 900;
    color: #2C1A06;
    line-height: 1.04;
    margin-bottom: 26px;
  }

  .og-bullets {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 19px;
    font-weight: 700;
    color: #7A5428;
    flex-wrap: wrap;
  }

  .og-bullet-sep {
    opacity: 0.35;
    font-size: 22px;
    line-height: 1;
  }

  /* ── Card fan on the right ── */
  .og-cards {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 640px;
    z-index: 2;
  }

  .og-cards img {
    position: absolute;
    filter: drop-shadow(0 24px 60px rgba(90, 50, 0, 0.28));
  }

  /* back left — jitensha (bicycle) */
  .og-cards img:nth-child(1) {
    width: 270px;
    top: 130px;
    left: 6px;
    transform: rotate(-12deg);
    z-index: 1;
  }

  /* back right — takushii (taxi) */
  .og-cards img:nth-child(2) {
    width: 270px;
    top: 130px;
    right: 28px;
    transform: rotate(12deg);
    z-index: 1;
  }

  /* star — imasu (meditating sensei), large and centered */
  .og-cards img:nth-child(3) {
    width: 330px;
    top: 64px;
    left: 50%;
    margin-left: -150px;
    transform: rotate(2deg);
    z-index: 2;
  }

  /* soft left-edge fade so cards blend into text area */
  .og-fade {
    position: absolute;
    left: 480px;
    top: 0;
    width: 170px;
    bottom: 0;
    background: linear-gradient(to right, #F5E9CF, transparent);
    z-index: 4;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="og">

  <div class="og-text">
    <div class="og-tag">Onigiri Sensei</div>
    <div class="og-divider"><span class="og-diamond"></span></div>
    <h1 class="og-headline">Japanese<br>that sticks.</h1>
    <div class="og-bullets">
      <span>Vocabulary</span>
      <span class="og-bullet-sep">·</span>
      <span>Conjugation</span>
      <span class="og-bullet-sep">·</span>
      <span>Quizzes</span>
    </div>
  </div>

  <div class="og-cards">
    <img src="src/assets/card-jitensha.png" alt="">
    <img src="src/assets/card-takushii.png" alt="">
    <img src="src/assets/card-imasu.png" alt="">
  </div>

  <div class="og-fade"></div>

</div>

</body>
</html>
